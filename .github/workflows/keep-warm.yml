# Free Hugging Face Spaces suspend themselves after about 48 hours idle, and a
# cold Space takes tens of seconds to answer its first request. During a judging
# window that stall reads as a broken demo, so poll the health endpoint often
# enough that the Space never goes idle.
#
# Set the repository variable HF_SPACE_URL (Settings > Secrets and variables >
# Actions > Variables) to the Space origin, with no trailing slash, for example
# https://your-username-hydraloop-api.hf.space
# Until that variable exists the job reports that it is unconfigured and exits
# without failing, so a fresh clone does not show a red X.
name: keep-warm

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health endpoint
        env:
          SPACE_URL: ${{ vars.HF_SPACE_URL }}
        run: |
          if [ -z "$SPACE_URL" ]; then
            echo "HF_SPACE_URL is not set; nothing to keep warm."
            exit 0
          fi

          # A sleeping Space can take a while to boot, so allow a long read
          # timeout and retry rather than calling the first slow reply a failure.
          for attempt in 1 2 3; do
            code=$(curl --silent --show-error --location \
                        --connect-timeout 15 --max-time 180 \
                        --output /dev/null --write-out '%{http_code}' \
                        "$SPACE_URL/api/health" || echo "000")
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Space is awake."
              exit 0
            fi
            sleep 30
          done

          echo "::error::$SPACE_URL/api/health did not return 200 after 3 attempts."
          exit 1
