name: HydraLoop CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Authenticity gate
        run: python scripts/check_authenticity.py

      - name: Validate catalog and genome schema
        run: python scripts/validate_catalog.py

      - name: Run tests with coverage
        run: |
          python -m pytest tests \
            --cov=hydraloop.twin --cov=hydraloop.red.dsl \
            --cov-report=term-missing --cov-fail-under=60 -v
