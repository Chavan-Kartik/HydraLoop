attack_id: AF-11
attack_name: "Deepfake-voice urgency payment (metadata proxy)"
family: social_engineering
payment_surface: [account_to_account_transfer]
genai_role: >
  Hypothesised use of synthetic voice to create urgency during a live call. We
  represent this strictly as a concurrent-call metadata flag plus a compressed
  decision window; no audio is generated or analysed.
abstraction_level: behavioral_metadata_only
assumptions:
  - "A concurrent inbound call flag coincides with the payment"
  - "Decision window is compressed relative to the user's baseline"
behavioral_signals:
  - concurrent_inbound_call_flag
  - compressed_decision_window
  - first_time_beneficiary_flag
  - out_of_hours_flag
detection_hypotheses: [urgency_window_anomaly, call_correlation_metadata]
mitigation_options: [cooling_off_hold, dynamic_warning, payee_verification_stepup]
risk_level: high
validation_status: unverified_hypothetical
harm_review: "No synthetic audio produced or processed; call metadata flag only."
