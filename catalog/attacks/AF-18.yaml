attack_id: AF-18
attack_name: "Distributed low-value validation across devices"
family: card_testing
payment_surface: [card_not_present]
genai_role: >
  Hypothesised distribution of validation attempts across many devices and
  sessions to defeat per-device velocity limits. We model the cross-device
  dispersion footprint only.
abstraction_level: behavioral_metadata_only
assumptions:
  - "Each device performs few attempts, but many devices participate"
  - "Attempts share a validation-amount signature"
behavioral_signals:
  - per_device_low_count
  - fleet_wide_amount_signature
  - asn_diversity_zscore
  - success_ratio_across_fleet
detection_hypotheses: [fleet_level_aggregation, cross_device_linkage]
mitigation_options: [fleet_rate_limit, step_up_3ds]
risk_level: medium
validation_status: unverified_hypothetical
harm_review: "No device-fleet tooling; dispersion statistics only."
evolvable: true
genome_template:
  victim_selection: {age_band: "18_24", target_side: account}
  amount_policy: {type: flat, base: balance, steps: [0.015], max_fraction: 0.02}
  timing_policy: {inter_txn_delay_mu: 0.8, inter_txn_delay_sigma: 0.3, dwell_before_cashout_h: 0.1}
  device_policy: {reuse: rotating, tamper: true, device_count: 18}
  channel_mix: {weights: {a2a: 0.0, wallet: 0.2, card_not_present: 0.8}}
  friction_response: {abandon_prob: 0.85, retry_after_h: 0.25, max_retries: 8}
  resource_budget: {mule_accounts: 0, synthetic_identities: 0, devices: 18, operator_hours: 0.8}
