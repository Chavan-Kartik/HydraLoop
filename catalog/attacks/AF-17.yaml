attack_id: AF-17
attack_name: "GenAI-tuned card-testing probing schedule"
family: card_testing
payment_surface: [card_not_present, wallet_topup]
genai_role: >
  Hypothesised optimisation of low-value probe timing and merchant selection to
  validate cards while staying under velocity thresholds. We model the probe
  cadence and low-amount footprint only; no card data is represented.
abstraction_level: behavioral_metadata_only
assumptions:
  - "Probes are very low value relative to typical traffic"
  - "Probe cadence adapts to avoid simple velocity rules"
behavioral_signals:
  - micro_amount_ratio
  - probe_cadence_adaptivity
  - merchant_hopping_rate
  - decline_then_retry_pattern
detection_hypotheses: [micro_amount_burst, adaptive_cadence_detection]
mitigation_options: [rate_limit_hold, step_up_3ds, decline]
risk_level: medium
validation_status: unverified_hypothetical
harm_review: "No card numbers or generators; probe-cadence parameters only."
evolvable: true
genome_template:
  victim_selection: {age_band: "18_24", target_side: account}
  amount_policy: {type: flat, base: balance, steps: [0.01], max_fraction: 0.02}
  timing_policy: {inter_txn_delay_mu: 1.0, inter_txn_delay_sigma: 0.4, dwell_before_cashout_h: 0.1}
  device_policy: {reuse: rotating, tamper: true, device_count: 10}
  channel_mix: {weights: {a2a: 0.0, wallet: 0.3, card_not_present: 0.7}}
  network_topology: {mule_fanout: 0, mule_fanin: 0, layering_depth: 0}
  friction_response: {abandon_prob: 0.8, retry_after_h: 0.5, max_retries: 6}
  resource_budget: {mule_accounts: 0, synthetic_identities: 0, devices: 10, operator_hours: 0.5}
