attack_id: AF-22
attack_name: "Smurfing and structuring below thresholds"
family: money_movement
payment_surface: [account_to_account_transfer]
genai_role: >
  Hypothesised splitting of value into many small transfers to stay below review
  thresholds. We model the below-threshold clustering and repetition footprint
  only.
abstraction_level: behavioral_metadata_only
assumptions:
  - "Transfer amounts cluster just below a salient threshold"
  - "Many small transfers occur in a compressed window"
behavioral_signals:
  - just_below_threshold_ratio
  - transfer_count_per_window
  - beneficiary_reuse_index
  - amount_rounding_signature
detection_hypotheses: [structuring_detection, threshold_clustering]
mitigation_options: [aggregate_velocity_hold, manual_review]
risk_level: high
validation_status: unverified_hypothetical
harm_review: "No structuring instructions; threshold-clustering statistics only."
evolvable: true
genome_template:
  victim_selection: {age_band: "45_54", target_side: account}
  amount_policy: {type: flat, base: balance, steps: [0.08], max_fraction: 0.1}
  timing_policy: {inter_txn_delay_mu: 2.5, inter_txn_delay_sigma: 0.4, dwell_before_cashout_h: 1.0}
  channel_mix: {weights: {a2a: 0.9, wallet: 0.1, card_not_present: 0.0}}
  network_topology: {mule_fanout: 6, mule_fanin: 6, layering_depth: 2}
  resource_budget: {mule_accounts: 6, synthetic_identities: 1, devices: 3, operator_hours: 5.0}
