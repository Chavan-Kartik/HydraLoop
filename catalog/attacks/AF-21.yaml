attack_id: AF-21
attack_name: "Mule-network fan-out cash-out"
family: money_movement
payment_surface: [account_to_account_transfer, wallet_topup]
genai_role: >
  Hypothesised coordination of a mule network to disperse value across many
  accounts quickly. We model the fan-out topology and dwell-before-cashout
  footprint only.
abstraction_level: behavioral_metadata_only
assumptions:
  - "Value fans out from one source to many mule accounts"
  - "Mules cash out after a short dwell"
behavioral_signals:
  - fan_out_degree
  - mule_account_age_hours
  - dwell_before_cashout
  - reconvergence_at_cashout
detection_hypotheses: [fan_out_graph_anomaly, mule_ring_clustering]
mitigation_options: [cooling_off_hold, graph_linkage_review, manual_review]
risk_level: high
validation_status: unverified_hypothetical
harm_review: "No mule-recruitment content; topology statistics only."
evolvable: true
genome_template:
  victim_selection: {age_band: "35_44", target_side: account}
  amount_policy: {type: ladder, base: balance, steps: [0.2, 0.4, 0.6], max_fraction: 0.7}
  timing_policy: {inter_txn_delay_mu: 3.5, inter_txn_delay_sigma: 0.7, dwell_before_cashout_h: 2.0}
  channel_mix: {weights: {a2a: 0.7, wallet: 0.3, card_not_present: 0.0}}
  network_topology: {mule_fanout: 8, mule_fanin: 2, layering_depth: 3}
  friction_response: {abandon_prob: 0.25, retry_after_h: 4.0, max_retries: 3}
  resource_budget: {mule_accounts: 8, synthetic_identities: 2, devices: 5, operator_hours: 6.0}
