attack_id: AF-09
attack_name: "LLM-orchestrated authorised push payment (APP) scam funnel"
family: social_engineering
payment_surface: [account_to_account_transfer, wallet_topup]
genai_role: >
  Hypothesised use of an LLM to conduct sustained, personalised, multi-turn
  persuasion at scale and to adapt when the victim hesitates. We simulate only
  the victim-side behavioural footprint (hesitation, new payee, urgency proxy),
  never the persuasion content.
abstraction_level: behavioral_metadata_only
assumptions:
  - "Victim-initiated payment; credentials never compromised"
  - "Beneficiary account age is short (<72h) in a subset of cases"
behavioral_signals:
  - new_payee_created_minutes_before_payment
  - session_duration_vs_user_baseline_zscore
  - concurrent_inbound_call_flag
  - hesitation_events
  - amount_relative_to_balance_percentile
detection_hypotheses: [victim_side_anomaly, beneficiary_graph_novelty]
mitigation_options: [dynamic_warning, cooling_off_hold, payee_verification_stepup]
risk_level: high
validation_status: unverified_hypothetical
harm_review: "No persuasion content, scripts, or voice; victim-side signals only."
evolvable: true
genome_template:
  victim_selection: {age_band: "55_plus", target_side: victim, balance_percentile_lo: 0.6, balance_percentile_hi: 0.9}
  amount_policy: {type: ladder, base: balance, steps: [0.12, 0.31, 0.57], max_fraction: 0.6}
  timing_policy: {inter_txn_delay_mu: 6.2, inter_txn_delay_sigma: 0.9, dwell_before_cashout_h: 2.5}
  device_policy: {reuse: victim_device, tamper: false, device_count: 1}
  channel_mix: {weights: {a2a: 0.8, wallet: 0.2, card_not_present: 0.0}}
  network_topology: {mule_fanout: 3, mule_fanin: 1, layering_depth: 2}
  friction_response: {abandon_prob: 0.35, retry_after_h: 6.0, max_retries: 2}
  resource_budget: {mule_accounts: 3, synthetic_identities: 0, devices: 1, operator_hours: 1.5}
