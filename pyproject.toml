[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydraloop"
version = "0.1.0"
description = "Synthetic, sandboxed, co-evolutionary adversarial payment security lab."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }

# The single declaration of what this project needs. `requirements.txt` is the
# pinned lock generated from these for exact reproduction; it is not a second
# source of truth. Keeping the list in two hand-edited places is what previously
# let `websockets` and `httpx` go missing from the pins while staying in the
# unpinned files, so a clean install silently lost the arena socket and the API
# tests.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.46",
    "torch>=2.4",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "jsonschema>=4.22",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "typer>=0.12",
    "structlog>=24.1",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    "python-docx>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# Replaces the sys.path shim that used to live in a root conftest.py, so the
# suite runs against a source checkout without an editable install.
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["hydraloop.twin", "hydraloop.red.dsl"]
branch = true
